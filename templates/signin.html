<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign in | AjiraScan</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<main class="auth-page">
  <a class="brand-logo" href="/"><img src="/static/images/ajirascan-logo.png" alt="AjiraScan"></a>
  <section class="auth-card">
    <p class="eyebrow">Welcome back</p><h1>Sign in</h1>
    <form method="post" action="/api/v1/auth/login">
      <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><label class="check"><input type="checkbox" onclick="password.type=this.checked?'text':'password'"> Show password</label>
      <button type="submit">Sign in</button>
    </form>
    <p><a href="/forgot-password">Forgot password?</a></p><p>New to AjiraScan? <a href="/signup">Create an account</a>.</p>
  </section>
</main>
</body>
</html>
